<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SKT Onboarding Demo</title>
<!--
  SKT · First-login onboarding — CLIENT DEMO (standalone, no backend)
  Mirrors src/pages/onboarding/*, components/onboarding/* and lib/onboardingTour.js.
  Everything is mocked in memory; reload or press "เริ่มใหม่" to reset.
  Works offline (Sarabun loads from Google Fonts when online, system Thai font otherwise).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f9fafb; --surface: #ffffff; --raised: #ffffff; --field: #f1f5f9;
  --fg: #111827; --fg2: #374151; --muted: #4b5563; --subtle: #6b7280;
  --line: rgb(229 231 235 / .7); --line-strong: #d1d5db; --field-line: #cbd5e1; --field-line-hover: #94a3b8;
  --soft: #f3f4f6; --soft2: #f9fafb; --track: #e5e7eb;
  --indigo: #4f46e5; --indigo-hover: #6366f1; --indigo-soft: #eef2ff; --indigo-ink: #4338ca; --indigo-dot: #818cf8;
  --emerald: #059669; --emerald-soft: #ecfdf5; --emerald-ink: #047857; --emerald-ray: #10b981;
  --amber-ink: #92400e; --amber-soft: #fffbeb; --amber-line: #fde68a; --amber-ring: rgb(245 158 11 / .8);
  --red: #dc2626;
  --scrim: rgb(17 17 24 / .55); --header-bg: rgb(255 255 255 / .9); --sticky-bg: rgb(249 250 251 / .95);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .05); --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / .25);
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
html.dark {
  --bg: #0b0b0f; --surface: #141419; --raised: #1c1c22; --field: #0f0f13;
  --fg: #f3f4f6; --fg2: #e5e7eb; --muted: #d1d5db; --subtle: #9ca3af;
  --line: rgb(255 255 255 / .08); --line-strong: rgb(255 255 255 / .14); --field-line: #6a6a74; --field-line-hover: #7e7e89;
  --soft: rgb(255 255 255 / .06); --soft2: rgb(255 255 255 / .04); --track: rgb(255 255 255 / .1);
  --indigo: #4f46e5; --indigo-hover: #6366f1; --indigo-soft: rgb(99 102 241 / .15); --indigo-ink: #a5b4fc; --indigo-dot: #818cf8;
  --emerald: #34d399; --emerald-soft: rgb(16 185 129 / .15); --emerald-ink: #6ee7b7; --emerald-ray: #34d399;
  --amber-ink: #fcd34d; --amber-soft: rgb(245 158 11 / .1); --amber-line: rgb(251 191 36 / .25); --amber-ring: rgb(251 191 36 / .8);
  --red: #f87171;
  --scrim: rgb(0 0 0 / .72); --header-bg: rgb(11 11 15 / .85); --sticky-bg: rgb(11 11 15 / .95);
  --shadow-sm: none; --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
  font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  transition: background-color .2s, color .2s;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--indigo-hover); outline-offset: 2px; }

/* ─── buttons (lib/styles.js) ───────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px;
  border-radius: 12px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color .2s, box-shadow .2s, transform .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .6; cursor: not-allowed; }
.btn-primary { background: var(--indigo); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover:not([disabled]) { background: var(--indigo-hover); }
html.dark .btn-primary { box-shadow: 0 0 0 1px rgb(129 140 248 / .35), 0 8px 24px -8px rgb(99 102 241 / .6); }
.btn-submit { background: #059669; color: #fff; }
.btn-submit:hover:not([disabled]) { background: #10b981; }
.btn-neutral { background: var(--surface); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line-strong); }
html.dark .btn-neutral { background: rgb(255 255 255 / .04); }
.btn-neutral:hover:not([disabled]) { background: var(--soft2); }
html.dark .btn-neutral:hover:not([disabled]) { background: rgb(255 255 255 / .08); }
.btn-ghost { height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--fg2); transition: background-color .15s; }
.btn-ghost:hover { background: var(--soft); }
.btn-big { height: 48px; padding: 0 24px; font-size: 16px; width: 100%; }
.icon-btn { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 12px; color: var(--muted); transition: background-color .15s; }
.icon-btn:hover { background: var(--soft); color: var(--fg); }
@media (min-width: 768px) {
  .btn { height: 40px; } .btn-big { height: 48px; width: auto; } .btn-ghost { height: 40px; } .icon-btn { width: 36px; height: 36px; }
}
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── animations (src/index.css) ────────────────────────────────────────── */
@keyframes ob-slide-next { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes ob-slide-prev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.anim-next { animation: ob-slide-next .3s var(--ease-out-quart) both; }
.anim-prev { animation: ob-slide-prev .3s var(--ease-out-quart) both; }
@keyframes ob-shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes ob-shake-b { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.shake-a { animation: ob-shake .4s var(--ease-out-quart); }
.shake-b { animation: ob-shake-b .4s var(--ease-out-quart); }
@keyframes ob-pulse-amber { 0% { opacity: 0; transform: scale(.98); } 35% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.03); } }
@keyframes ob-draw { from { stroke-dashoffset: var(--ob-from, 1); } to { stroke-dashoffset: var(--ob-to, 0); } }
.draw { animation: ob-draw .7s var(--ease-out-expo) .1s both; }
.draw-late { animation: ob-draw .5s var(--ease-out-expo) .35s both; }
@keyframes ob-burst { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35); } }
.burst { animation: ob-burst .9s var(--ease-out-expo) .3s both; transform-origin: center; transform-box: fill-box; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes dialog-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
.fade-in { animation: fade-in .25s var(--ease-out-quart) both; }
.fade-up { animation: fade-up .35s var(--ease-out-quart) both; }
.stagger > * { animation: fade-up .45s var(--ease-out-quart) both; }
.stagger > *:nth-child(2) { animation-delay: .06s; } .stagger > *:nth-child(3) { animation-delay: .12s; }
.stagger > *:nth-child(4) { animation-delay: .18s; } .stagger > *:nth-child(5) { animation-delay: .24s; }
.stagger > *:nth-child(6) { animation-delay: .30s; } .stagger > *:nth-child(7) { animation-delay: .36s; }
.stagger > *:nth-child(8) { animation-delay: .42s; }

/* ─── login ─────────────────────────────────────────────────────────────── */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 24px; padding: 32px 24px;
  box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
.logo { border-radius: 8px; object-fit: contain; background: #fff; }
.login h1 { margin: 20px 0 2px; font-size: 24px; line-height: 1.35; }
.login .sub { margin: 0 0 24px; color: var(--muted); font-size: 15px; }

/* ─── fields ────────────────────────────────────────────────────────────── */
.label { display: block; margin-bottom: 6px; font-size: 15px; font-weight: 600; color: var(--fg2); }
.req { color: var(--red); margin-left: 2px; }
.opt { margin-left: 6px; font-size: 14px; font-weight: 400; color: var(--subtle); }
.input { width: 100%; border-radius: 16px; border: 1px solid var(--field-line); background: var(--field); padding: 12px;
  font-size: 16px; color: var(--fg); transition: border-color .15s, box-shadow .15s; }
.input::placeholder { color: #94a3b8; }
.input:hover { border-color: var(--field-line-hover); }
.input:focus { border-color: var(--indigo-hover); box-shadow: 0 0 0 3px rgb(99 102 241 / .25); outline: none; }
.input[readonly] { background: var(--soft2); border-color: var(--line); color: var(--muted); }
.input[type=date] { min-height: 50px; }
@media (min-width: 768px) { .input { font-size: 15px; } }
.frame { position: relative; }
.flag-ring { position: absolute; inset: -3px; border-radius: 18.4px; box-shadow: 0 0 0 2px var(--amber-ring); pointer-events: none; }
.flag-pulse { position: absolute; inset: -7px; border-radius: 22.4px; background: rgb(251 191 36 / .15); box-shadow: 0 0 0 2px rgb(251 191 36 / .4);
  pointer-events: none; animation: ob-pulse-amber 1.1s var(--ease-out-quart) .15s 1 both; }
.hint { margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--amber-ink); }
.hint svg.i { width: 16px; height: 16px; }
.help { margin: 6px 0 0; font-size: 14px; color: var(--subtle); }
.grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } .full { grid-column: 1 / -1; } }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--fg2);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--field-line); transition: background-color .15s, color .15s, box-shadow .15s; }
.chip:hover { box-shadow: inset 0 0 0 1px var(--field-line-hover); }
.chip[aria-checked="true"] { background: var(--indigo-soft); color: var(--indigo-ink); box-shadow: inset 0 0 0 1.5px var(--indigo-hover); font-weight: 600; }
@media (min-width: 768px) { .chip { min-height: 40px; } }

/* ─── onboarding shell ──────────────────────────────────────────────────── */
.obh { position: sticky; top: 0; z-index: 30; background: var(--header-bg); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.obh-in { max-width: 768px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.obh-title { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obh-title span { margin-left: 8px; font-size: 14px; font-weight: 400; color: var(--subtle); }
.obh-track { height: 2px; background: var(--soft); }
.obh-bar { height: 100%; background: var(--indigo); transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease-out-quart); }
html.dark .obh-bar { background: var(--indigo-dot); }
.wrap { max-width: 768px; margin: 0 auto; padding: 0 16px 40px; }
@media (min-width: 768px) { .obh-in, .wrap { padding-left: 24px; padding-right: 24px; } }
.pt-intro { padding-top: 32px; } @media (min-width: 768px) { .pt-intro { padding-top: 56px; } }
.pt-sec { padding-top: 12px; }

.h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
@media (min-width: 768px) { .h1 { font-size: 28px; } }
.lead { margin: 6px 0 0; max-width: 62ch; font-size: 16px; color: var(--muted); }

/* welcome */
.welcome { max-width: 576px; margin: 0 auto; }
.wl-top { display: flex; align-items: center; gap: 20px; }
.points { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 20px; }
.points li { display: flex; gap: 16px; }
.pt-ic { display: flex; width: 40px; height: 40px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 12px; background: var(--indigo-soft); color: var(--indigo-ink); }
.pt-t { display: block; font-weight: 600; } .pt-s { display: block; font-size: 15px; color: var(--muted); }
.checklist { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.checklist h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--subtle); }
.checklist ol { list-style: none; margin: 0; padding: 0; }
.cl-btn { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-radius: 12px; text-align: left; transition: background-color .15s; }
.cl-btn:hover { background: var(--soft); }
.cl-num { display: flex; width: 24px; height: 24px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.cl-num.done { background: #059669; color: #fff; box-shadow: none; }
.cl-num svg.i { width: 14px; height: 14px; stroke-width: 3; }
.cl-label { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.cl-state { font-size: 14px; color: var(--subtle); } .cl-state.done { color: var(--emerald-ink); }

/* ring */
.ring { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; }
.ring svg { transform: rotate(-90deg); }
.ring .track { stroke: var(--track); }
.ring .arc { stroke: var(--indigo); transition: stroke-dashoffset .6s var(--ease-out-expo); }
html.dark .ring .arc { stroke: var(--indigo-dot); }
.ring .arc.done { stroke: var(--emerald); }
.ring-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
.ring-txt b { font-size: 24px; } .ring-txt small { font-size: 14px; color: var(--subtle); }
.ring.sm .ring-txt b { font-size: 14px; } .ring.sm .ring-txt small { font-size: 11px; }

/* stepper (components/ui/Stepper.jsx) */
.stepper { position: sticky; top: 56px; z-index: 20; margin: 0 -16px 20px; padding: 8px 16px; background: var(--sticky-bg);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
@media (min-width: 768px) { .stepper { margin: 0 0 20px; padding: 8px 0; } }
.stepper ol { list-style: none; display: flex; align-items: center; margin: 0; padding: 0; }
.stepper li { display: flex; align-items: center; } .stepper li.grow { flex: 1; }
.st-btn { display: flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; border-radius: 12px; }
.st-dot { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--track); color: var(--muted); transition: background-color .15s, box-shadow .2s; }
html.dark .st-dot { background: #374151; color: #d1d5db; }
.st-dot.done, .st-dot.active { background: var(--indigo); color: #fff; }
html.dark .st-dot.done, html.dark .st-dot.active { background: var(--indigo-hover); color: #fff; }
.st-dot.active { box-shadow: 0 0 0 4px rgb(99 102 241 / .2); }
.st-dot.err { background: #dc2626; color: #fff; }
.st-dot svg.i { width: 16px; height: 16px; stroke-width: 2.5; }
.st-line { flex: 1; height: 2px; margin: 0 4px; border-radius: 2px; background: var(--track); transition: background-color .2s; }
html.dark .st-line { background: #374151; }
.st-line.on { background: var(--indigo); } html.dark .st-line.on { background: var(--indigo-hover); }
.st-cap { margin: 4px 0 0; font-size: 14px; } .st-cap .n { color: var(--subtle); } .st-cap b { font-weight: 600; }
.st-cap .short { display: inline; } .st-cap .long { display: none; }
@media (min-width: 768px) { .st-cap .short { display: none; } .st-cap .long { display: inline; } }

.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
@media (min-width: 768px) { .card { padding: 24px; } }
.sec-head { margin-bottom: 20px; } @media (min-width: 768px) { .sec-head { margin-bottom: 24px; } }

.ro { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 20px; padding: 12px 16px; border-radius: 12px; background: var(--soft2); box-shadow: inset 0 0 0 1px var(--line); }
.ro dt { font-size: 13px; color: var(--subtle); } .ro dd { margin: 0; font-weight: 600; }
.ro .note { grid-column: 1 / -1; font-size: 13px; color: var(--subtle); }
.ro .note button { color: var(--indigo-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

.problem { margin-top: 20px; padding: 16px; border-radius: 16px; background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber-line); }
.problem p { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--amber-ink); }
.problem ul { margin: 8px 0 0; padding-left: 28px; font-size: 15px; color: var(--amber-ink); }

.actions { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
.actions .spacer { flex: 1; }
@media (max-width: 767px) {
  .actions { position: sticky; bottom: 0; z-index: 15; margin: 24px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--header-bg); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .actions .spacer { display: none; } .actions .btn-primary { flex: 1; }
}

/* rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
html.dark .row { background: rgb(255 255 255 / .02); }
.row-main { flex: 1; min-width: 0; } .row-t { margin: 0; font-weight: 600; } .row-l { margin: 0; font-size: 14px; color: var(--muted); }
.badge { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--indigo-soft); color: var(--indigo-ink); vertical-align: 2px; }
.row-act { display: flex; gap: 2px; margin: -6px -8px -6px 0; }
.add { width: 100%; min-height: 52px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px;
  border: 1.5px dashed var(--field-line); color: var(--indigo-ink); font-size: 15px; font-weight: 600; transition: background-color .15s, border-color .15s; }
.add:hover { background: var(--indigo-soft); border-color: var(--indigo-hover); }
.empty { margin: 0; padding: 20px 16px; border-radius: 16px; text-align: center; font-size: 15px; color: var(--subtle); background: var(--soft2); }
.none { margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; text-align: left;
  box-shadow: inset 0 0 0 1px var(--line-strong); transition: background-color .15s, box-shadow .15s; }
.none[aria-checked="true"] { background: var(--indigo-soft); box-shadow: inset 0 0 0 1.5px var(--indigo-hover); }
.box { display: flex; width: 22px; height: 22px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--field-line); color: #fff; }
.none[aria-checked="true"] .box { background: var(--indigo); box-shadow: none; }
.box svg.i { width: 14px; height: 14px; stroke-width: 3; opacity: 0; } .none[aria-checked="true"] .box svg.i { opacity: 1; }
.none b { display: block; font-weight: 600; } .none small { display: block; font-size: 14px; color: var(--subtle); }

/* intro steps */
.center { max-width: 448px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 16px; }
@media (min-width: 768px) { .center { padding-top: 40px; } .center .btn-big { min-width: 256px; } }
.loader { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 96px; color: var(--muted); font-size: 15px; }
.loader svg.i { width: 28px; height: 28px; color: var(--indigo-hover); }

/* celebration */
.cel .ray-e { stroke: var(--emerald-ray); } .cel .ray-i { stroke: var(--indigo-dot); }
.cel .disc { fill: var(--emerald-soft); } .cel .ring-l { stroke: var(--emerald); } .cel .check { stroke: var(--emerald); }
html.dark .cel .check { stroke: #6ee7b7; }

function ring(value, total, size, stroke, sm = false) {
  const r = (size - stroke) / 2, frac = Math.min(1, value / total), done = frac >= 1;
  const arc = frac > 0
    ? `<circle class="arc draw ${done ? "done" : ""}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" style="--ob-from:1;--ob-to:${1 - frac};stroke-dashoffset:${1 - frac}"/>`
    : "";
  return `<div class="ring ${sm ? "sm" : ""}" role="img" aria-label="กรอกแล้ว ${value} จาก ${total} หัวข้อ" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>${arc}</svg>
    <span class="ring-txt tnum" aria-hidden="true"><b>${value}</b><small>/${total}</small></span></div>`;
}
function celebration(size) {
  const rays = Array.from({ length: 12 }, (_, i) => {
    const a = (i / 12) * Math.PI * 2, r1 = 50, r2 = i % 2 ? 58 : 62;
    return `<line x1="${64 + Math.cos(a) * r1}" y1="${64 + Math.sin(a) * r1}" x2="${64 + Math.cos(a) * r2}" y2="${64 + Math.sin(a) * r2}" stroke-width="3" stroke-linecap="round" class="${i % 2 ? "ray-i" : "ray-e"}"/>`;
  }).join("");
  return `<svg class="cel" width="${size}" height="${size}" viewBox="0 0 128 128" aria-hidden="true" style="overflow:visible">
    <g class="burst">${rays}</g>
    <circle class="disc" cx="64" cy="64" r="40"/>
    <circle class="ring-l draw" cx="64" cy="64" r="40" fill="none" stroke-width="3" pathLength="1" stroke-dasharray="1 1" style="--ob-from:1;--ob-to:0;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box"/>
    <path class="check draw-late" d="M47 65 L59 77 L82 52" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" style="--ob-from:1;--ob-to:0"/>
  </svg>`;
}

// ─── toast ───────────────────────────────────────────────────────────────────
function toast(tone, title, desc = "", action = null) {
  const el = document.createElement("div");
  el.className = `toast ${tone}`;
  el.setAttribute("role", "status");
  const icon = { success: "check", info: "info", warning: "triangle" }[tone];
  el.innerHTML = `<span class="ic">${ic(icon)}</span><span class="tx"><b>${esc(title)}</b>${desc ? `<small>${esc(desc)}</small>` : ""}</span>${action ? `<button type="button" class="act">${esc(action.label)}</button>` : ""}`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 200); };
  if (action) el.querySelector(".act").onclick = () => { action.onClick(); close(); };
  $("#toaster").appendChild(el);
  setTimeout(close, action ? 5000 : 3200);
}

function goStep(step) {
  const prev = STEP_KEYS.indexOf(S.step);
  S.dir = prev === -1 || STEP_KEYS.indexOf(step) >= prev ? "next" : "prev";
  S.step = step;
  S.problem = null;
  S.flagged = new Set();
  S.shake = "";
  if (S.view !== "onboarding") { S.view = "onboarding"; render(); }
  else renderStep(true);
  scrollTo({ top: 0 });
  $("#obMain")?.focus({ preventScroll: true });
}

function renderStep(anim) {
  const main = $("#obMain");
  if (!main) return;
  const k = S.step;
  main.className = `wrap ${KEYS.includes(k) ? "pt-sec" : "pt-intro"}`;
  const body = k === "welcome" ? welcomeHTML() : k === "ready" ? readyHTML() : sectionHTML(k);
  main.innerHTML = `<div class="${anim ? (S.dir === "prev" ? "anim-prev" : "anim-next") : ""}">${body}</div>`;
  updateHeader();
}

function validate(k) {
  const d = S.d, miss = [];
  (REQUIRED[k] ?? []).forEach((f) => blank(d[k][f]) && miss.push(f));
  if (k === "family") {
    if (d.personal.m_status === "สมรส" && !d.family.some((r) => r.relationship === "คู่สมรส")) miss.push("spouse_row");
    if (d.family.filter((r) => r.relationship === "บุตร").length !== Number(d.personal.children_number || 0)) miss.push("children_count");
  }
  if (k === "education" && !d.education.length) miss.push("rows");
  if ((k === "work" || k === "criminal") && !d[k].length && !d.none[k]) miss.push("rows_none");
  return miss;
}
function nextAfter(k) {
  if (S.confirmed.size === 7) return "ready";
  const i = KEYS.indexOf(k);
  return [...KEYS.slice(i + 1), ...KEYS.slice(0, i)].find((x) => !S.confirmed.has(x)) ?? "ready";
}
async function save() {
  if (S.busy) return;

  S.busy = true;
  btn.disabled = true;
  btn.innerHTML = `${ic("loader", "spin")}กำลังบันทึก`;
  await wait(650);
  S.busy = false;
  const miss = validate(k);
  if (miss.length) {
    S.problem = miss;
    S.flagged = new Set(miss.filter((m) => FIELD_LABELS[m]));
    S.failed.add(k);
    S.shake = S.shake === "a" ? "b" : "a";
    renderStep(false);

    (first ?? $(".problem"))?.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" });
    return;
  }
  S.confirmed.add(k);
  S.failed.delete(k);
  if (S.confirmed.size === 7) S.unlocked = true;
  toast("success", `บันทึก “${meta(k).label}” แล้ว`);
  goStep(nextAfter(k));
}

let measureRaf = 0;
async function tourStep(first = false) {
  const st = TOUR[S.tour.i], card = $("#tcard");
  setDrawer(Boolean(st.sidebar));
  card.innerHTML = tourCardHTML();
  card.classList.toggle("phone", isPhone());

  if (target && !st.sidebar) {
    const r = target.getBoundingClientRect(), vh = innerHeight;
    const cardH = isPhone() ? card.offsetHeight : 0;
    const desired = isPhone() ? Math.max(72, (vh - cardH - r.height) / 2) : (vh - r.height) / 2;
    const dy = r.top - desired;
    if (Math.abs(dy) > 8) scrollBy({ top: dy, behavior: reduced() ? "auto" : "smooth" });
  }
  await wait(first || st.sidebar || S.tour.i === 1 ? 380 : 320);
  placeTour();
  card.classList.remove("hidden");

}
function placeTour() {
  const spot = $("#spot"), card = $("#tcard");
  if (!spot || !S.tour.active) return;
  const st = TOUR[S.tour.i], el = $(`[data-tour="${st.target}"]`);
  const vw = innerWidth, vh = innerHeight, PAD = 8, GAP = 16;
  let hole;
  if (el) {
    const r = el.getBoundingClientRect();
    hole = { top: r.top - PAD, left: r.left - PAD, width: r.width + PAD * 2, height: r.height + PAD * 2, r: 20 };
    spot.classList.remove("none");
  } else {
    hole = { top: vh / 2, left: vw / 2, width: 0, height: 0, r: 16 };
    spot.classList.add("none");
  }
  Object.assign(spot.style, { top: `${hole.top}px`, left: `${hole.left}px`, width: `${hole.width}px`, height: `${hole.height}px`, borderRadius: `${hole.r}px` });
  card.classList.toggle("phone", isPhone());
  if (isPhone()) return;
  const W = Math.min(384, vw - GAP * 2);
  card.style.width = `${W}px`;
  const H = card.offsetHeight;
  let x, y;
  if (!el) { x = (vw - W) / 2; y = (vh - H) / 2; }
  else if (hole.left + hole.width + GAP + W <= vw - GAP) { x = hole.left + hole.width + GAP; y = hole.top; }
  else if (hole.left - GAP - W >= GAP) { x = hole.left - GAP - W; y = hole.top; }
  else { x = hole.left + hole.width / 2 - W / 2; y = hole.top + hole.height + GAP; if (y + H > vh - GAP) y = hole.top - GAP - H; }
  x = Math.max(GAP, Math.min(vw - W - GAP, x));
  y = Math.max(GAP, Math.min(vh - H - GAP, y));
  card.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
}
const onViewport = () => { cancelAnimationFrame(measureRaf); measureRaf = requestAnimationFrame(placeTour); };

async function finishTour() {
  const b = $("#tourNext");
  b.disabled = true;
  b.innerHTML = `${ic("loader", "spin")}เสร็จสิ้น`;
  await wait(600);
  endTour();
  S.onboarded = true;
  renderHome();
  scrollTo({ top: 0 });
  const f = document.createElement("div");
  f.className = "flourish";
  f.setAttribute("role", "status");
  f.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center">${celebration(152)}<p class="t">พร้อมใช้งานแล้ว</p><p class="s">เมนูบริการตนเองเปิดให้ใช้ครบทุกเมนู</p></div>`;
  const done = () => { f.classList.add("out"); setTimeout(() => f.remove(), 300); };
  f.onclick = done;
  $("#layer").appendChild(f);
  toast("success", "เริ่มใช้งานบริการตนเองได้แล้ว");
  setTimeout(done, reduced() ? 900 : 1900);
}

// ─── events ──────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;
  switch (a) {
    case "theme": setTheme(!document.documentElement.classList.contains("dark")); break;
    case "restart": endTour(); S = fresh(); $("#layer").innerHTML = ""; $("#toaster").innerHTML = ""; render(); scrollTo({ top: 0 }); break;
    case "start": goStep(KEYS.find((k) => !S.confirmed.has(k)) ?? "ready"); break;
    case "go": goStep(t.dataset.step); break;
    case "back": { const i = KEYS.indexOf(S.step); goStep(i > 0 ? KEYS[i - 1] : "welcome"); break; }
    case "save": save(); break;
    case "later": S.view = "home"; render(); scrollTo({ top: 0 }); toast("info", "กลับมากรอกต่อได้ทุกเมื่อ", "ความคืบหน้าถูกบันทึกไว้แล้ว"); break;
    case "resume": goStep("welcome"); break;
    case "report": toast("info", "เปิดแบบฟอร์มแจ้ง HR", "ในระบบจริงจะส่งคำขอแก้ไขให้ HR ตรวจสอบ"); break;
    case "tour": startTour(); break;
    case "choose": {
      const [sec, key] = t.dataset.bind.split(".");
      S.d[sec][key] = t.dataset.val;
      t.parentElement.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-checked", String(c === t)));
      unflag(key);
      break;
    }
    case "none": S.d.none[S.step] = !S.d.none[S.step]; recheck(); renderStep(false); break;
    case "row-add": openSheet(S.step); break;
    case "row-edit": openSheet(S.step, Number(t.dataset.i)); break;
    case "row-del": {
      const k = S.step, i = Number(t.dataset.i), [row] = S.d[k].splice(i, 1);
      recheck(); renderStep(false);
      toast("info", `ลบ${ROWS[k].noun}แล้ว`, "", { label: "เลิกทำ", onClick: () => { S.d[k].splice(i, 0, row); recheck(); if (S.step === k) renderStep(false); } });
      break;
    }
    case "sheet-close": S.sheet = null; renderSheet(); break;
    case "sheet-choose": {
      S.sheet.form[t.dataset.key] = t.dataset.val;
      t.parentElement.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-checked", String(c === t)));
      break;
    }
    case "sheet-save": sheetSave(); break;
    case "menu": setDrawer(true); break;
    case "menu-close": setDrawer(false); break;
    case "open-menu": {
      setDrawer(false);
      const name = t.dataset.name;
      if (!S.unlocked) { goStep("welcome"); toast("info", `เมนู “${name}” จะเปิดเมื่อกรอกข้อมูลครบ`, "กรอกให้ครบ 7 หัวข้อ แล้วดูทัวร์เมนูสั้น ๆ"); }
      else toast("info", name, "หน้านี้อยู่ในระบบจริง (ไฟล์นี้เป็นตัวอย่างการเริ่มใช้งาน)");
      break;
    }
    case "tour-next": if (S.tour.i === TOUR.length - 1) finishTour(); else { S.tour.i += 1; tourStep(); } break;
    case "tour-back": S.tour.i -= 1; tourStep(); break;
    case "tour-skip": endTour(); S.tourSkipped = true; renderHome(); toast("info", "ดูทัวร์ต่อได้จากแถบด้านบน"); break;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.bind) {
    const [sec, key] = t.dataset.bind.split(".");
    S.d[sec][key] = t.value;
    if (!blank(t.value)) unflag(key);
  } else if (t.dataset.sheet && S.sheet) S.sheet.form[t.dataset.sheet] = t.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.sheet) { S.sheet = null; renderSheet(); }
  else if (S.tour.active) $('[data-action="tour-skip"]')?.click();
  else setDrawer(false);
});
// field fixed by the user: calm the amber frame + panel line immediately
function unflag(key) {
  if (!S.flagged.has(key)) return;
  S.flagged.delete(key);
  const w = $(`[data-field="${key}"]`);
  w?.querySelectorAll(".flag-ring,.flag-pulse,.hint").forEach((n) => n.remove());
  w?.querySelector("[aria-invalid]")?.removeAttribute("aria-invalid");
  recheck();
  $(`[data-missing="${key}"]`)?.remove();
  if (!S.problem) $(".problem")?.remove();
}

function setTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  $("#themeIc").innerHTML = P[dark ? "sun" : "moon"];
  $("#themeLbl").textContent = dark ? "โหมดสว่าง" : "โหมดมืด";
  try { localStorage.setItem("skt_demo_dark", String(dark)); } catch { /* storage blocked */ }
}
let storedDark = null;
try { storedDark = localStorage.getItem("skt_demo_dark"); } catch { /* storage blocked */ }
setTheme(storedDark != null ? storedDark === "true" : matchMedia("(prefers-color-scheme: dark)").matches);
render();
</script>
</body>
