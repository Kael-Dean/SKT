
<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/skt-logo-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Browser chrome colour follows the app's light/dark page background (gray-50 / graphite canvas) -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/logo/skt-logo.png" />
    <!--
      Content Security Policy (client-side baseline via <meta>).
      NOTE: this is a first layer. Headers like X-Frame-Options,
      X-Content-Type-Options(nosniff) and HSTS cannot be set via <meta> and
      must be configured on the host/CDN — see SECURITY-NOTES.md.
      connect-src lists the known API origins + local dev; img-src allows
      https/data/blob for avatars & generated previews. Verify in DevTools
      console (no CSP violations) before deploying.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://api.amcsurin.com https://um-repo-243977022740.asia-southeast1.run.app https://*.run.app http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>สหกรณ์การเกษตร SKT สุรินทร์</title>
    <!-- Sarabun self-hosted ใน src/index.css (@font-face) — เลิกพึ่ง Google Fonts CDN -->
  </head>
  <body>
    <!-- Boot screen: น้องหอมทอง (static pose) paints before the JS bundle runs; React replaces it on first render -->
    <div id="root">
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <img src="/mascot/homthong.svg" alt="" width="240" height="240" />
        <p style="margin:0;font-family:sans-serif;font-size:16px;color:#64748b">กำลังโหลด…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
