name: Deploy Vite React to GCS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      GCS_BUCKET_RAW: ${{ secrets.GCS_BUCKET }}           # เช่น skt-front (ไม่มี gs://, ไม่มีเครื่องหมายคำพูด)
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}       # เช่น peaceful-web-469207-h1
      GCP_CDN_URL_MAP: ${{ secrets.GCP_CDN_URL_MAP }}     # optional

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build
        run: |
          npm ci || npm i
          npm run build

      - name: Auth with Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud (includes gsutil)
        uses: google-github-actions/setup-gcloud@v2

      # --- Normalize + Validate + Ensure bucket exists ---
      - name: Verify/Create GCS bucket
        id: verify_bucket
        run: |
          set -euo pipefail

          raw="${GCS_BUCKET_RAW:-}"
          # ตัด gs://, ตัด / ท้าย, ตัดช่องว่าง/quote, บังคับเป็นตัวเล็ก
          raw="${raw#gs://}"
          raw="${raw%/}"
          # shellcheck disable=SC2001
          raw="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^["'\'']+//; s/["'\'']+$//')"

          echo "Using bucket (normalized): $raw"
          if [ -z "$raw" ]; then
            echo "ERROR: GCS_BUCKET is empty after normalization"; exit 1
          fi

          # ตรวจตามกฎชื่อบัคเก็ต
          # - 3..63 ตัวอักษร
          # - เริ่ม/จบด้วย [a-z0-9]
          # - ใช้ได้เฉพาะ [a-z0-9._-]
          if [ ${#raw} -lt 3 ] || [ ${#raw} -gt 63 ] || ! echo "$raw" | grep -Eq '^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$'; then
            echo "ERROR: Invalid bucket name after normalization: '$raw'"
            exit 1
          fi

          echo "BUCKET_NORMALIZED=$raw" >> "$GITHUB_OUTPUT"

          PROJECT="${GCP_PROJECT_ID:-}"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(gcloud config get-value core/project || true)"
          fi
          if [ -z "$PROJECT" ]; then
            echo "ERROR: GCP_PROJECT_ID is empty and no active gcloud project set."; exit 1
          fi
          echo "Using project: $PROJECT"

          if ! gcloud storage buckets describe "gs://$raw" --project="$PROJECT" >/dev/null 2>&1; then
            echo "Bucket gs://$raw not found. Creating..."
            gcloud storage buckets create "gs://$raw" \
              --project="$PROJECT" \
              --location=ASIA-SOUTHEAST1 \
              --uniform-bucket-level-access
          else
            echo "Bucket gs://$raw exists."
          fi

          # ตั้งหน้าเว็บ (idempotent)
          gcloud storage buckets update "gs://$raw" \
            --web-main-page-suffix=index.html \
            --web-error-page=index.html || true

      # --- Upload with correct Cache-Control at upload time ---
      # ลำดับสำคัญ (บั๊กจริง พ.ย. 2026: กด "รีเฟรชตอนนี้" แล้วค้างหน้าโหลด):
      #   1. assets ใหม่ขึ้นก่อน — ห้ามลบ assets เก่าก่อนอัปโหลด: แท็บ/CDN ที่ยังถือ index.html เก่าต้องโหลด hash เก่าได้
      #   2. boot-guard.js (ตัวกู้หน้าโหลดค้าง ที่ index.html เรียก) — ไม่อัปโหลด = 404 = ไม่มีอะไรกู้
      #   3. index.html ท้ายสุด — ตัวเช็คเวอร์ชันในแอป (src/lib/appUpdate.js) เห็นเวอร์ชันใหม่ตอนไฟล์ครบแล้วเท่านั้น
      #   4. ลบ assets เก่าที่ไม่ใช่ของ build นี้ และเก่ากว่า 14 วัน
      - name: Upload assets, boot-guard.js, then index.html (last)
        env:
          BUCKET: ${{ steps.verify_bucket.outputs.BUCKET_NORMALIZED }}
        run: |
          set -euo pipefail
          echo "Using bucket: $BUCKET"

          test -f dist/index.html || { echo "dist/index.html not found. Did build fail?"; exit 1; }
          test -f dist/boot-guard.js || { echo "dist/boot-guard.js not found. Did build fail?"; exit 1; }

          # 1) assets (immutable + cache ยาว) — ไม่ลบของเก่าก่อน
          if [ -d "dist/assets" ]; then
            gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" cp -r "dist/assets/*" "gs://$BUCKET/assets/"
          else
            echo "WARN: dist/assets not found (Vite may have inlined assets)"
          fi

          # 2) boot-guard.js (ชื่อไม่มี hash → no-cache)
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:text/javascript; charset=utf-8" \
                 cp "dist/boot-guard.js" "gs://$BUCKET/boot-guard.js"

          # 3) index.html ท้ายสุด (no-cache)
          gsutil -h "Cache-Control:no-cache" cp "dist/index.html" "gs://$BUCKET/index.html"

      - name: Prune old assets (not in this build, older than 14 days)
        env:
          BUCKET: ${{ steps.verify_bucket.outputs.BUCKET_NORMALIZED }}
        run: |
          set -uo pipefail
          [ -d dist/assets ] || exit 0
          cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          ls dist/assets > /tmp/current_assets.txt
          # `gsutil ls -l` → "<size>  <YYYY-MM-DDTHH:MM:SSZ>  gs://bucket/assets/<name>"
          gsutil ls -l "gs://$BUCKET/assets/**" 2>/dev/null \
            | awk -v cutoff="$cutoff" '$3 ~ /^gs:\/\// && $2 < cutoff { print $3 }' \
            | while read -r obj; do
                name="${obj##*/}"
                grep -qxF "$name" /tmp/current_assets.txt || echo "$obj"
              done > /tmp/stale_assets.txt
          echo "Stale assets to delete: $(wc -l < /tmp/stale_assets.txt)"
          if [ -s /tmp/stale_assets.txt ]; then
            gsutil -m rm -I < /tmp/stale_assets.txt || echo "WARN: prune failed (deploy still OK)"
          fi

      # --- Upload public data (gzipped JSON) + logo (cacheable) ---
      # ไฟล์ใน public/ ตกที่ dist root ไม่เข้า /assets/ → ต้องตั้ง header เอง
      # GCS ไม่ gzip ให้อัตโนมัติ จึง pre-gzip + ตั้ง Content-Encoding:gzip
      # (sub_district.json 2.2MB → ~250-400KB on wire)
      - name: Upload public data + logo (gzipped JSON, cacheable)
        env:
          BUCKET: ${{ steps.verify_bucket.outputs.BUCKET_NORMALIZED }}
        run: |
          set -euo pipefail
          echo "Using bucket: $BUCKET"

          if [ -d "dist/data/thai" ]; then
            for f in dist/data/thai/*.json; do
              [ -e "$f" ] || continue
              gzip -9 -k -f "$f"                # สร้าง $f.gz เก็บไฟล์ต้นฉบับไว้
              name="$(basename "$f")"
              # upload bytes ของ .gz ไปที่ชื่อ object ปกติ + บอก browser ว่าเป็น gzip
              # ต้องตั้ง Content-Type:application/json เอง ไม่งั้น gsutil เดาเป็น application/gzip
              gsutil -h "Content-Type:application/json" \
                     -h "Content-Encoding:gzip" \
                     -h "Cache-Control:public, max-age=86400, stale-while-revalidate=604800" \
                     cp "$f.gz" "gs://$BUCKET/data/thai/$name"
            done
          else
            echo "WARN: dist/data/thai not found"
          fi

          if [ -d "dist/logo" ]; then
            gsutil -m -h "Cache-Control:public, max-age=86400, must-revalidate" cp -r "dist/logo/*" "gs://$BUCKET/logo/"
          fi

          # mascot (homthong.svg / .png / .riv) — ใช้ใน index.html boot loader + <Mascot>
          # ไม่อัปโหลด = GCS ตอบ index.html (404) แทน → รูปน้องหาย
          if [ -d "dist/mascot" ]; then
            gsutil -m -h "Cache-Control:public, max-age=86400, must-revalidate" cp -r "dist/mascot/*" "gs://$BUCKET/mascot/"
          else
            echo "WARN: dist/mascot not found"
          fi

      - name: Upload PWA files (service worker, offline page, manifest, icons)
        env:
          BUCKET: ${{ steps.verify_bucket.outputs.BUCKET_NORMALIZED }}
        run: |
          set -euo pipefail
          echo "Using bucket: $BUCKET"

          for f in dist/sw.js dist/offline.html dist/manifest.webmanifest dist/pwa/icon-192.png; do
            test -f "$f" || { echo "$f not found. Did build fail?"; exit 1; }
          done

          # ชื่อไอคอนไม่มี hash → cache แบบเดียวกับ logo
          gsutil -m -h "Cache-Control:public, max-age=86400, must-revalidate" cp -r "dist/pwa/*" "gs://$BUCKET/pwa/"

          # gsutil เดา content-type ของ .webmanifest ไม่ได้ → ต้องตั้งเอง
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:application/manifest+json" \
                 cp "dist/manifest.webmanifest" "gs://$BUCKET/manifest.webmanifest"
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:text/html; charset=utf-8" \
                 cp "dist/offline.html" "gs://$BUCKET/offline.html"

          # sw.js ขึ้นท้ายสุด: ตอน install มัน precache offline.html + pwa/* ถ้ายังไม่มีไฟล์ install จะล้ม
          gsutil -h "Cache-Control:no-cache" -h "Content-Type:text/javascript; charset=utf-8" \
                 cp "dist/sw.js" "gs://$BUCKET/sw.js"

      # --- Optional: Invalidate Cloud CDN ---
      - name: Invalidate Cloud CDN (optional)
        if: ${{ env.GCP_CDN_URL_MAP != '' }}
        run: |
          set -euo pipefail
          echo "Invalidating CDN cache for URL Map: ${GCP_CDN_URL_MAP}"
          gcloud compute url-maps invalidate-cdn-cache "${GCP_CDN_URL_MAP}" --path "/*" --quiet