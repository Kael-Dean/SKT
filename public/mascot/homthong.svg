<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="น้องหอมทอง มาสคอต AMC">
  <defs>
    <radialGradient id="ht-contact" cx="0" cy="0" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ht-grainSide" x1="-12" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F3ECDC"/><stop offset="1" stop-color="#D9CAA8"/>
    </linearGradient>
    <linearGradient id="ht-hand" x1="0" y1="12" x2="0" y2="-12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4EDDD"/><stop offset="1" stop-color="#D9CAA8"/>
    </linearGradient>
    <radialGradient id="ht-ao" cx="0" cy="0" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A3A10" stop-opacity=".65"/>
      <stop offset=".6" stop-color="#5A3A10" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5A3A10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ht-sleeve" x1="0" y1="12" x2="0" y2="-12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C95E"/><stop offset=".55" stop-color="#DDA737"/><stop offset="1" stop-color="#B9832A"/>
    </linearGradient>
    <linearGradient id="ht-leafBack" x1="-2" y1="6" x2="-40" y2="-28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E8A34"/><stop offset="1" stop-color="#7DB656"/>
    </linearGradient>
    <linearGradient id="ht-leafFront" x1="2" y1="8" x2="54" y2="-42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A9A3C"/><stop offset=".45" stop-color="#6FA84A"/><stop offset="1" stop-color="#9ED170"/>
    </linearGradient>
    <linearGradient id="ht-seed" x1="-3" y1="-5" x2="3" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDA7A"/><stop offset="1" stop-color="#D39E32"/>
    </linearGradient>
    <radialGradient id="ht-base" cx="-30" cy="-196" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".28" stop-color="#FDFBF6"/><stop offset=".55" stop-color="#F6F0E2"/>
      <stop offset=".82" stop-color="#E9DFC8"/><stop offset="1" stop-color="#D8C8A6"/>
    </radialGradient>
    <radialGradient id="ht-form" cx="-44" cy="-200" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9B48C" stop-opacity="0"/><stop offset=".34" stop-color="#C9B48C" stop-opacity="0"/>
      <stop offset=".62" stop-color="#C9B48C" stop-opacity=".55"/><stop offset="1" stop-color="#9C8460" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="ht-hl" cx="0" cy="0" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ht-cheek" cx="0" cy="0" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59A7A" stop-opacity=".7"/><stop offset=".55" stop-color="#F59A7A" stop-opacity=".35"/><stop offset="1" stop-color="#F59A7A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ht-iris" x1="0" y1="-16" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1208"/><stop offset=".45" stop-color="#3A2410"/><stop offset="1" stop-color="#9A6128"/>
    </linearGradient>
    <radialGradient id="ht-husk" cx="-40" cy="-110" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7A3"/><stop offset=".22" stop-color="#F4C653"/><stop offset=".48" stop-color="#E8B53A"/>
      <stop offset=".75" stop-color="#D29C32"/><stop offset="1" stop-color="#B9832A"/>
    </radialGradient>
    <radialGradient id="ht-huskShade" cx="-50" cy="-120" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A06A1E" stop-opacity="0"/><stop offset=".52" stop-color="#A06A1E" stop-opacity="0"/>
      <stop offset=".76" stop-color="#A06A1E" stop-opacity=".35"/><stop offset="1" stop-color="#7E5016" stop-opacity=".7"/>
    </radialGradient>
    <path id="ht-grain" d="M14-290C52-290 80-230 80-150C80-60 42 6-4 6C-48 6-78-55-78-130C-78-215-26-290 14-290Z"/>
    <path id="ht-huskPath" d="M86-150C86-56 45 12-4 12C-52 12-84-52-84-128C-84-140-82-150-78-158C-72-112-52-62-24-56C-14-54-7-46-2-42C3-46 10-54 18-56C52-62 72-112 80-164C84-160 86-156 86-150Z"/>
    <path id="ht-ridges" d="M-2-36C0-22 0-8-3 4M32-52C40-36 36-14 22-2M-36-54C-44-36-40-14-27-2M68-112C76-84 68-50 46-26M-69-112C-76-84-70-50-50-26"/>
    <g id="ht-eye">
      <ellipse rx="12" ry="16" fill="url(#ht-iris)"/>
      <ellipse cy="-1.5" rx="6.5" ry="9.5" fill="#140A03"/>
      <circle cx="-4" cy="-7" r="5" fill="#fff"/>
      <circle cx="5" cy="7" r="2.25" fill="#fff" fill-opacity=".85"/>
    </g>
  </defs>

  <g transform="translate(256 455) scale(1 .13)"><circle r="85" fill="url(#ht-contact)"/></g>

  <g transform="translate(256 452)">
    <!-- legs (white grain) -->
    <rect x="-39.5" y="-33" width="25" height="36" rx="12.5" fill="url(#ht-grainSide)" stroke="#9C8462" stroke-width="2.5"/>
    <rect x="10.5" y="-33" width="25" height="36" rx="12.5" fill="url(#ht-grainSide)" stroke="#9C8462" stroke-width="2.5"/>
    <g transform="translate(-2 -18) scale(1 .22)"><circle r="45" fill="url(#ht-ao)"/></g>

    <g transform="translate(0 -22)">
      <!-- sprout -->
      <g transform="translate(14 -282)">
        <path transform="scale(1.2)" d="M-1 4C-10-14-24-27-42-30C-32-14-18-1-1 9Z" fill="url(#ht-leafBack)"/>
      </g>
      <polyline points="13.5,-272 16,-302 19,-326 25,-348" fill="none" stroke="#5E9A3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(23 -351)">
        <path d="M0 0C12-10 30-9 40 7" fill="none" stroke="#7E9B3C" stroke-width="3" stroke-linecap="round"/>
        <ellipse rx="3.5" ry="6" fill="url(#ht-seed)" transform="translate(11 -1) rotate(-15)"/>
        <ellipse rx="3.5" ry="6" fill="url(#ht-seed)" transform="translate(22 0) rotate(-5)"/>
        <ellipse rx="3.5" ry="6" fill="url(#ht-seed)" transform="translate(32 5) rotate(12)"/>
        <ellipse rx="3.5" ry="6" fill="url(#ht-seed)" transform="translate(40 14) rotate(24)"/>
      </g>
      <g transform="translate(14 -282)">
        <path transform="scale(1.25)" d="M1 5C12-18 30-36 56-44C44-24 26-4 3 11Z" fill="url(#ht-leafFront)"/>
      </g>

      <!-- arms: husk sleeve + white grain hand -->
      <g transform="translate(68 -78) rotate(64)">
        <circle cx="46" r="12.5" fill="url(#ht-hand)" stroke="#9C8462" stroke-width="3"/>
        <rect x="-5" y="-13" width="46" height="26" rx="12.5" fill="url(#ht-sleeve)" stroke="#9A661C" stroke-opacity=".8" stroke-width="2.5"/>
      </g>
      <g transform="translate(-68 -72) rotate(116)">
        <circle cx="46" r="12.5" fill="url(#ht-hand)" stroke="#9C8462" stroke-width="3"/>
        <rect x="-5" y="-13" width="46" height="26" rx="12.5" fill="url(#ht-sleeve)" stroke="#9A661C" stroke-opacity=".8" stroke-width="2.5"/>
      </g>

      <!-- white grain body -->
      <use href="#ht-grain" fill="url(#ht-base)" stroke="#9C8462" stroke-width="3.5"/>
      <use href="#ht-grain" fill="url(#ht-form)"/>
      <g transform="translate(-32 -196) rotate(14) scale(.7 1.5)"><circle r="35" fill="url(#ht-hl)"/></g>
      <path d="M50-264C66-246 75-206 75-150" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3.5" stroke-linecap="round"/>

      <!-- face -->
      <g transform="translate(4 -100)">
        <g transform="translate(-46 6) scale(1 .55)"><circle r="16" fill="url(#ht-cheek)"/></g>
        <g transform="translate(52 6) scale(1 .55)"><circle r="16" fill="url(#ht-cheek)"/></g>
        <g transform="translate(-30 -10)">
          <use href="#ht-eye"/>
          <path d="M-14-9C-10-19 8-20 14-11" fill="none" stroke="#2A170A" stroke-width="3.2" stroke-linecap="round"/>
        </g>
        <g transform="translate(30 -10)">
          <use href="#ht-eye"/>
          <path d="M-14-11C-8-20 10-19 14-9" fill="none" stroke="#2A170A" stroke-width="3.2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 22)">
          <path d="M-11 0C-5 1.8 5 1.8 11 0C10 11.5-10 11.5-11 0Z" fill="#4A2410"/>
          <ellipse cy="6.2" rx="4.5" ry="1.8" fill="#E77A5E"/>
        </g>
      </g>

      <!-- golden husk jacket -->
      <path d="M-62-105C-50-75-36-65-24-63C-14-61-7-53-2-49C3-53 10-61 18-63C34-67 52-79 64-109" fill="none" stroke="#B0946A" stroke-opacity=".12" stroke-width="18" stroke-linecap="round"/>
      <path d="M-62-105C-50-75-36-65-24-63C-14-61-7-53-2-49C3-53 10-61 18-63C34-67 52-79 64-109" fill="none" stroke="#A88C60" stroke-opacity=".2" stroke-width="9" stroke-linecap="round"/>
      <use href="#ht-huskPath" fill="url(#ht-husk)" stroke="#9A661C" stroke-width="3.5"/>
      <use href="#ht-huskPath" fill="url(#ht-huskShade)"/>
      <path d="M-76-152C-70-110-51-65-24-59C-14-57-7-49-2-45C3-49 10-57 18-59C50-65 70-110 78-158" fill="none" stroke="#FFF2C8" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
      <use href="#ht-ridges" transform="translate(-3 0)" fill="none" stroke="#FFEDB8" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#ht-ridges" fill="none" stroke="#A8721F" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
